version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flowable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable"]
      interval: 30s
      timeout: 10s
      retries: 3
 
  flowable-rest:
    image: flowable/flowable-rest:7.0.0
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flowable
      - SPRING_DATASOURCE_USERNAME=flowable
      - SPRING_DATASOURCE_PASSWORD=flowable
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    depends_on:
      - postgres
      
  flowable-idm:
    image: flowable/flowable-idm:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy      
      
  flowable-modeler:
    image: flowable/flowable-modeler:latest
    container_name: flowable-modeler
    ports:
      - "8888:8888"    
    environment:
      # Настройки базы данных
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLOWABLE_COMMON_APP_IDM-URL: http://localhost:8081/flowable-idm
      FLOWABLE_COMMON_APP_IDM-ADMIN_USER: admin
      FLOWABLE_COMMON_APP_IDM-ADMIN_PASSWORD: test      
      
   
       

volumes:
  postgres_data: