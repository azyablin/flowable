spring:
  application:
    name: flowable-client
  liquibase:
    enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect


  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XE
    username: flowable
    password: flowable
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 120000




  security:
    user:
      name: admin
      password: admin
      roles: ADMIN,USER

flowable:
  async-executor-activate: true
  async-executor-core-pool-size: 10
  async-executor-max-pool-size: 50
  async-executor-keep-alive-seconds: 60

  # Ускорение получения jobs из БД
  async-executor-default-async-job-acquire-wait-time: 1000  # 1 секунда вместо 10
  async-executor-default-timer-job-acquire-wait-time: 1000
  async-executor-max-async-jobs-due-per-acquisition: 500    # Больше за раз
  async-executor-max-timer-jobs-per-acquisition: 500

  # Оптимизация блокировок
  async-executor-lock-wait-time: 60000      # 1 минута вместо 5
  async-executor-timer-lock-time-in-millis: 120000
  async-executor-async-job-lock-time-in-millis: 120000
  async-executor-max-locked-rows: 5000      # Больше одновременно

  # Параллельная обработка
  async-executor-acquire-by-due-date: true
  async-executor-acquire-by-priority: true

  rest-api-enabled: true


  database-schema-update: true
  database-type: oracle
  transaction:
    propagation: REQUIRED
  history-level: none
  cmmn:
    enabled: false
  dmn:
    enabled: false
  process:
    async:
      executor:
        global-acquire-lock-enabled: true



app:
  job:
    interceptor:
      enabled: true




server:
  port: ${FLOWABLE_SERVER_PORT:8095}
  servlet:
    context-path: /



logging:
  file:
    name: log/flowable.log


springdoc:
  swagger-ui:
    doc-expansion: none
    default-models-expand-depth: -1
