plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'io.freefair.lombok' version '6.6.1'
}


ext {
    flowableVersion = '8.0.0'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenLocal()
    mavenCentral()

}




dependencies {
    // Spring Boot
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'
    implementation('org.springframework.boot:spring-boot-starter-web');
    implementation('org.springframework.boot:spring-boot-starter-aop');
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.2.0.0'

    // Flowable
    implementation "org.flowable:flowable-engine:${flowableVersion}"
    implementation "org.flowable:flowable-spring-boot-starter:${flowableVersion}"

    implementation 'org.codehaus.groovy:groovy-jsr223:3.0.22'



    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0') {
        exclude group: "io.swagger.core.v3", module: "swagger-annotations"
    }

  //  implementation 'org.liquibase:liquibase-core'

    compileOnly 'org.springframework.boot:spring-boot-starter-tomcat'


    // Database
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // MyBatis для Flowable UI
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.2'

    // Utils
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

bootJar {
    enabled = true
}

