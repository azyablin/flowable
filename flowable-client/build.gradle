plugins {
    id 'java'
   // id 'war'
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'io.freefair.lombok' version '6.6.1'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()

}

ext {
    flowableVersion = '7.2.0'
}


dependencies {
    // Spring Boot
    implementation('org.springframework.boot:spring-boot-starter-web');
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.2.0.0'
    // Flowable
    implementation "org.flowable:flowable-spring-boot-starter-process:${flowableVersion}"
    implementation "org.flowable:flowable-spring-boot-starter-process-rest:${flowableVersion}"
    implementation "org.flowable:flowable-spring-boot-starter-process:${flowableVersion}"
    implementation "org.flowable:flowable-spring-boot-starter-cmmn:${flowableVersion}"
    implementation "org.flowable:flowable-spring-boot-starter-dmn:${flowableVersion}"
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0') {
        exclude group: "io.swagger.core.v3", module: "swagger-annotations"
    }

  //  implementation 'org.liquibase:liquibase-core'

    compileOnly 'org.springframework.boot:spring-boot-starter-tomcat'

    implementation 'com.hazelcast:hazelcast'
    implementation 'com.hazelcast:hazelcast-spring'


    // Database
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // MyBatis для Flowable UI
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.2'

    // Utils
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

bootJar {
    enabled = true
}

